# Experiment E1 scientific variables
model_id: openai-community/gpt2
n: 32
state_dim: 16
bits: 2
seed: 17
target_ratio: 1.0
transcript_length: 0
train_all_queries: false
finite_state:
  enabled: true
  access_mode: sealed_prefix
  bits_per_coordinate: 2
  clip_value: 1.0
  learnable_clip: false

# Pilot training budget (not a theorem variable; hold fixed across dp points)
train_samples: 4096
dev_samples: 1024
test_samples: 2048
batch_size: 8
gradient_accumulation_steps: 4
max_steps: 500
learning_rate: 0.00005
weight_decay: 0.01
warmup_ratio: 0.05
max_grad_norm: 1.0
bf16: true
device: auto
log_every_steps: 25
output_dir: results/e1_frontier_nl
