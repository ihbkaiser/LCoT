project: evidencegraph-qa
save_path: ckpts
name: musique-gpt2-full-finite-qcond-b256-t4-p4

dataset: musique
musique_interface: question_conditioned
only_eval: false
coconut: true
cot: false
no_thoughts: false
no_cot: false

latent_steps: 4
c_thought: 1
epochs_per_stage: 1
max_latent_stage: 4
pad_latent_to_max: true
finite_state:
  enabled: true
  state_dim: 64
  bits_per_coordinate: 8
  clip_value: 1.0
  learnable_clip: false
  access_mode: sealed_prefix

save_only_improve: true
save_best_only: true
uniform_prob: 0.0
model_id: gpt2
pretrained_model_id: gpt2
use_lora: false
tokenizer: gpt2
require_bpe: true
load_model_path: None

seed: 17
resume: 0
bf16: true
training_dtype: float32
train_path: data/musique_ans_v1.0_train.jsonl
val_path: data/musique_ans_v1.0_dev.jsonl
distractors: 8
max_paragraph_tokens: 112
max_prefix_tokens: 896
max_sequence_tokens: 1024
max_answer_tokens: 64
reset_optimizer: false
batch_size_training: 2
debug: false
debug_samples: 128
show_preprocessing_progress: true
preprocessing_workers: 8
gradient_accumulation_steps: 8
num_epochs: 8
lr: 1.0e-4
weight_decay: 0.01
