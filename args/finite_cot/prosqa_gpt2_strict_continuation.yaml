project: finite-cot
save_path: ckpts
name: prosqa-gpt2-full-finite-strict-d64-p4

dataset: prosqa
continuation_interface: strict_continuation
only_eval: false
coconut: true
cot: false
no_thoughts: false
no_cot: false

